name = "chillin-api"
main = "workers/api.js"
# 兼容性日期：升级会影响 Worker 的运行时默认行为，改动后需回归验证
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# R2 对象存储 — 图片二进制与 D1 备份快照的存放地（D1 只保留元数据）
# 部署前需先创建桶：npx wrangler r2 bucket create chillin-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "chillin-media"

# D1 数据库 — 部署后需要把 database_id 替换为实际值
[[d1_databases]]
binding = "DB"
database_name = "chillin-db"
database_id = "59ad83a1-35f2-4e8c-b181-14d064627f1b"

[vars]
ALLOW_REGISTRATION = "false"
# 公钥可公开；私钥请用 `wrangler secret put VAPID_PRIVATE_KEY`，勿写入本文件
VAPID_PUBLIC_KEY = "BBj8FZZ57_GfEm-HGPo9pXRA5jsd4FAzu-3bQJC7KjAoGp3TWlDGFt5D22JadZ6t5bw9u6NDNsy4Vgny9v3r2e0"

# 🤖 DeepSeek 大语言模型配置（可选：在 Cloudflare 后台添加密钥变量 LLM_API_KEY）
# API 的 model 名是 deepseek-flash；DeepSeek-V4.1-Flash-1017 是它的版本名，不要写进 model。
LLM_API_BASE = "https://api.deepseek.com/v1"
LLM_MODEL = "deepseek-flash"
VISION_MODEL = "deepseek-flash"

# 定时任务：两条 —— 每分钟那条只跑微信 ClawBot 长轮询（消息实时性），
# 每小时第 13 分钟那条才跑 UGC 扫描与各类清理（见 workers/src/maintenance.js）。
[triggers]
crons = ["13 * * * *", "* * * * *"]
