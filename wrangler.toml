name = "chillin-api"
main = "workers/api.js"
# 兼容性日期：升级会影响 Worker 的运行时默认行为，改动后需回归验证
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# D1 数据库 — 部署后需要把 database_id 替换为实际值
[[d1_databases]]
binding = "DB"
database_name = "chillin-db"
database_id = "59ad83a1-35f2-4e8c-b181-14d064627f1b"

[vars]
ALLOW_REGISTRATION = "false"
# 公钥可公开；私钥请用 `wrangler secret put VAPID_PRIVATE_KEY`，勿写入本文件
VAPID_PUBLIC_KEY = "BBj8FZZ57_GfEm-HGPo9pXRA5jsd4FAzu-3bQJC7KjAoGp3TWlDGFt5D22JadZ6t5bw9u6NDNsy4Vgny9v3r2e0"

# 🤖 DeepSeek 大语言模型配置（可选：在 Cloudflare 后台添加密钥变量 LLM_API_KEY）
# 外链兜底解析：true 时允许把页面自身没有标题/封面的链接送往 Microlink（第三方）
# 隐私优先可设为 "false"，此时完全不会向第三方发送用户链接
LINK_ENRICH_MICROLINK = "true"
LLM_API_BASE = "https://api.deepseek.com/v1"
LLM_MODEL = "deepseek-chat"

# 定时任务：每小时扫描 UGC 违规内容
[triggers]
crons = ["13 * * * *"]
