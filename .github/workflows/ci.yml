name: CI

# 把 AGENTS.md 的「双 100% 卡点」固化为不可绕过：单测 0 失败 + 边缘预打包 Exit 0。
# 本地提交前仍建议自行跑一遍，CI 只是最后一道网。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # CI 只跑当前提交的构建与测试，不需要完整历史——浅克隆省下绝大部分 checkout 时间。
          # 仓库体积的历史评估与瘦身结论见 docs/archive/仓库体积与历史瘦身评估.md。
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          # 单一基线：Node 22 自带 node:sqlite；npm test 的 pretest 会硬拦 < 22.5。
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit + integration tests (must be 0 failures)
        run: npm test

      - name: Edge bundle dry-run (must exit 0)
        # --dry-run 只在本地打包，不上传、不需要 Cloudflare 凭据
        run: npx wrangler deploy --dry-run

      - name: Pages output layout is complete
        # Cloudflare Pages 只发布 public/（build_config.destination_dir = "public"），
        # 少一个文件线上就是空白/404，因此在 CI 里卡住。
        run: |
          for f in index.html sw.js _headers manifest.json version.json app.js style.css favicon.ico; do
            test -f "public/$f" || { echo "missing public/$f"; exit 1; }
          done
          test -d public/js && test -d public/icons && test -d public/vendor

  deploy-worker:
    name: Deploy Worker
    needs: quality-gate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

  notify-qa:
    name: Dispatch Cross-Repo QA
    needs: [quality-gate]
    if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger chillin-test repository_dispatch
        env:
          DISPATCH_TOKEN: ${{ secrets.CHILLIN_QA_DISPATCH_TOKEN }}
          EVENT_BEFORE: ${{ github.event.before || '' }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::notice::CHILLIN_QA_DISPATCH_TOKEN secret is not configured; skipping cross-repo QA dispatch."
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/2089700996jy-del/chillin-test/dispatches" \
            -d "$(node -e 'console.log(JSON.stringify({
              event_type: "chillin-updated",
              client_payload: {
                sha: process.env.GITHUB_SHA,
                before: process.env.EVENT_BEFORE || "",
                ref: process.env.GITHUB_REF_NAME || "main",
                event_name: process.env.GITHUB_EVENT_NAME || "push",
                repository: process.env.GITHUB_REPOSITORY || ""
              }
            }))')"
