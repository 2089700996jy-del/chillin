name: CI

# 把 AGENTS.md 的「双 100% 卡点」固化为不可绕过：单测 0 失败 + 边缘预打包 Exit 0。
# 本地提交前仍建议自行跑一遍，CI 只是最后一道网。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Node 20 = 项目声明的运行基线；Node 22 = 跑得上 node:sqlite 的集成用例
        # （tests/fake-d1.mjs 在旧版本上会自动跳过那些用例）。
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
        with:
          # 历史里有约 95 MB 与代码无关的媒体文件（见 docs/仓库体积与历史瘦身评估.md），
          # 浅克隆让 CI 只拉当前提交，省下绝大部分下载时间。
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit + integration tests (must be 0 failures)
        run: npm test

      - name: Edge bundle dry-run (must exit 0)
        # --dry-run 只在本地打包，不上传、不需要 Cloudflare 凭据
        run: npx wrangler deploy --dry-run
